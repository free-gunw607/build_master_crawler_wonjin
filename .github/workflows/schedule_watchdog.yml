name: Schedule Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  detect-missing-schedule:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check latest schedule run age
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          workflow_file="hourly_notices.yml"
          now_epoch="$(date -u +%s)"
          current_hour_utc="$(date -u +%Y-%m-%dT%H)"
          current_minute_utc="$(date -u +%M)"
          expected_minute=7
          grace_minute=8
          recovery_cooldown_minutes=45

          last_created="$(gh api "repos/${repo}/actions/workflows/${workflow_file}/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // empty')"

          if [ -z "${last_created}" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "message=[크론 누락] ${workflow_file}의 schedule 실행 이력이 아직 1건도 없습니다." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_recovery_created="$(gh api "repos/${repo}/actions/workflows/${workflow_file}/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].created_at // empty')"
          if [ -n "${latest_recovery_created}" ]; then
            recovery_epoch="$(date -u -d "${latest_recovery_created}" +%s)"
            recovery_age_minutes="$(( (now_epoch - recovery_epoch) / 60 ))"
            if [ "${recovery_age_minutes}" -ge 0 ] && [ "${recovery_age_minutes}" -lt "${recovery_cooldown_minutes}" ]; then
              echo "status=cooldown" >> "$GITHUB_OUTPUT"
              echo "message=[복구 대기] 최근 recovery 실행이 ${recovery_age_minutes}분 전이라 중복 dispatch를 생략합니다. (created_at=${latest_recovery_created})" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          last_epoch="$(date -u -d "${last_created}" +%s)"
          age_minutes="$(( (now_epoch - last_epoch) / 60 ))"
          last_hour_utc="$(date -u -d "${last_created}" +%Y-%m-%dT%H)"

          if [ "${last_hour_utc}" != "${current_hour_utc}" ] && [ "${current_minute_utc#0}" -ge $((expected_minute + grace_minute)) ]; then
            echo "status=stale_current_hour" >> "$GITHUB_OUTPUT"
            echo "message=[크론 누락] 이번 UTC 시간대(${current_hour_utc}:00) schedule 실행이 아직 없습니다. (last=${last_created})" >> "$GITHUB_OUTPUT"
          elif [ "${age_minutes}" -gt 90 ]; then
            echo "status=stale" >> "$GITHUB_OUTPUT"
            echo "message=[크론 지연] 마지막 schedule 실행이 ${age_minutes}분 전입니다. (created_at=${last_created})" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "message=[정상] 마지막 schedule 실행은 ${age_minutes}분 전입니다. (created_at=${last_created})" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram on missing/stale schedule
        if: steps.check.outputs.status == 'stale_current_hour' || steps.check.outputs.status == 'stale' || steps.check.outputs.status == 'missing'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          set -euo pipefail
          text="🚨 GitHub Actions 스케줄 감시 알림\n${MESSAGE}\nrepo=${{ github.repository }}\nworkflow=hourly_notices.yml"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null

      - name: Trigger recovery run
        if: steps.check.outputs.status == 'stale_current_hour' || steps.check.outputs.status == 'stale' || steps.check.outputs.status == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hourly_notices.yml --repo "${repo}" -f dry_run=false
          echo "Recovery dispatch triggered for hourly_notices.yml"

      - name: Record stale status
        if: steps.check.outputs.status == 'stale_current_hour' || steps.check.outputs.status == 'stale' || steps.check.outputs.status == 'missing'
        run: |
          echo "${{ steps.check.outputs.message }}"
